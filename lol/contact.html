<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasty Eats - Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="contact.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header">
    <h1>Tasty Eats Bakery</h1>
    <p>We'd love to hear from you!</p>
  </header>

  <section class="contact-info">
    <div class="info-box">
      <h2>Customer Service</h2>
      <p>Chat with us live: <button id="chat-btn">Start Chat</button></p>
      <p>Phone: <a href="tel:+1234567890">+1 234-567-890</a></p>
      <p>Email: <a href="mailto:support@tastyeats.com">support@tastyeats.com</a></p>
      <p>Address: 123 Sweet St, Bakersville, NY</p>
    </div>
    <div class="info-box">
        <h2>Feedback & Inquiries</h2>
      <form id="contact-form">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="your.email@example.com" required />

        <label for="message">Message *</label>
        <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2025 Tasty Eats Bakery. All rights reserved.</p>
    <!-- Social Media Section -->
<div class="social-links">
  <h3>Follow Us</h3>
  <a href="https://facebook.com/YourPage" target="_blank"><i class="fab fa-facebook-f"></i></a>
  <a href="https://tiktok.com/@YourUsername" target="_blank"><i class="fab fa-tiktok"></i></a>
  <a href="https://instagram.com/YourPage" target="_blank"><i class="fab fa-instagram"></i></a>
</div>

  </footer>

  <script>
    document.getElementById('chat-btn').addEventListener('click', function () {
      alert('Live chat is currently offline. Please email us or call instead!');
    });

    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
  alert('Thank you for your message! We will get back to you soon.');
      this.reset();
    });
  </script>
</body>
</html>
