<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasty Eats - Sign Up/Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Tasty Eats</h1>
      <p>Bakery Sign Up & Login</p>
      <div class="tabs">
        <button id="showSignup" class="active">Sign Up</button>
        <button id="showLogin">Login</button>
      </div>

      <!-- Sign Up Form -->
      <form id="signupForm" class="form">
        <input type="text" id="signupName" placeholder="Name" required />
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="password" id="signupPassword" placeholder="Password" required />
        <button type="submit">Create Account</button>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="form hidden">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
    </div>
  </div>

  <script>
    // Toggle tabs
document.getElementById("showSignup").onclick = () => {
  document.getElementById("signupForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("showSignup").classList.add("active");
  document.getElementById("showLogin").classList.remove("active");
};

document.getElementById("showLogin").onclick = () => {
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("showLogin").classList.add("active");
  document.getElementById("showSignup").classList.remove("active");
};

// Store signup data
document.getElementById("signupForm").addEventListener("submit", function(e) {
  e.preventDefault();
  localStorage.setItem("email", document.getElementById("signupEmail").value);
  localStorage.setItem("pass", document.getElementById("signupPassword").value);
  alert("Account created! Please log in.");
  document.getElementById("showLogin").click();
});
// Login and redirect
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPassword").value;

  if (email === localStorage.getItem("email") && pass === localStorage.getItem("pass")) {
    alert("Welcome to Tasty Eats!");
    window.location.href = "homepage.html";
  } else {
    alert("Incorrect email or password.");
  }
});


  </script>
</body>
</html>
